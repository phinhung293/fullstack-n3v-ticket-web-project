spring.application.name=demo
server.port=8080

# Chay profile local. Neu khong co file application-local.properties thi van co default ben duoi.
spring.profiles.active=local
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Database PostgreSQL / Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT: bat buoc >= 32 ky tu. Co the override bang JWT_SECRET hoac application-local.properties
jwt.secret=${JWT_SECRET:n3v-ticket-local-dev-secret-key-please-change-this-before-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

